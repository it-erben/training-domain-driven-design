include:
  - component: "gitlab.com/it-erben/components/pdf-publisher/build-publish@1.7.0"
  - component: "gitlab.com/it-erben/components/linters/lychee-lint@1.3.0"
  - component: "gitlab.com/it-erben/components/linters/yaml-lint@1.3.0"
  - component: "gitlab.com/it-erben/components/linters/markdown-lint@1.3.0"
  - component: "gitlab.com/it-erben/components/release/release@1.0.0"
  - component: "gitlab.com/it-erben/components/maven/verify@1.2.0"


stages:
  - lint
  - build
  - verify
  - release
  - deploy

docker:
  stage: deploy
  image: docker:27
  services:
    - docker:dind
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: build
      artifacts: true
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build --build-arg VERSION=$CI_COMMIT_TAG -t $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
    - docker push $CI_REGISTRY_IMAGE:latest

verify-deployment:
  stage: deploy
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: docker
  environment:
    name: production
    url: https://domain-driven-design.erben.tech
  script:
    - apk add --no-cache curl
    - echo "Waiting for Flux to deploy $CI_COMMIT_TAG..."
    - |
      for i in $(seq 1 40); do
        LIVE_VERSION=$(curl -sf https://domain-driven-design.erben.tech/version 2>/dev/null || echo "")
        if [ "$LIVE_VERSION" = "$CI_COMMIT_TAG" ]; then
          echo "Deployment verified: $CI_COMMIT_TAG is live after $((i * 15))s"
          exit 0
        fi
        echo "Attempt $i/40 - live=$LIVE_VERSION, want=$CI_COMMIT_TAG - waiting 15s..."
        sleep 15
      done
      echo "Deployment verification timed out after 10 minutes"
      exit 1
