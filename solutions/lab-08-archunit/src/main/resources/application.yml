spring:
  application:
    name: realestate-crm
  datasource:
    url: jdbc:h2:mem:realestatecrm
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080
