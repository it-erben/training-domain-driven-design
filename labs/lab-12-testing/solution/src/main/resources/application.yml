spring:
  application:
    name: realestate-crm-lab11
  datasource:
    url: jdbc:h2:mem:immobiliencrm
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080
